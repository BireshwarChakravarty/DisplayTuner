name: Gamut Pro
on:
  push:
    paths: ["DisplayTuner/**", "scripts/**", ".github/workflows/display-tuner.yml"]
  pull_request:
    paths: ["DisplayTuner/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: display-tuner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Validate release metadata
        run: python3 scripts/validate-release.py
      - name: Core tests
        run: swift test --package-path DisplayTuner
      - name: Package
        run: bash DisplayTuner/make-app.sh --package
      - name: Verify
        run: codesign --verify --deep --strict "DisplayTuner/.build/app/Gamut Pro.app"
      - name: Screenshots (demo workspace, no hardware access)
        continue-on-error: true
        run: bash scripts/screenshots.sh "DisplayTuner/.build/app/Gamut Pro.app" screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: GamutPro
          path: DisplayTuner/dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
