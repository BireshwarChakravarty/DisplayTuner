name: Display Tuner
on:
  push:
    paths: ["DisplayTuner/**", "scripts/**", ".github/workflows/display-tuner.yml"]
  pull_request:
    paths: ["DisplayTuner/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: display-tuner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Core tests
        run: swift test --package-path DisplayTuner
      - name: Package
        run: bash DisplayTuner/make-app.sh --package
      - name: Verify
        run: codesign --verify --deep --strict "DisplayTuner/.build/app/Display Tuner.app"
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayTuner
          path: DisplayTuner/dist/*
