name: Delete releases
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to delete (with their tags)"
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $TAGS; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag && echo "deleted $tag"
          done
