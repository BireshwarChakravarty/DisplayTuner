name: Publish Gamut Pro
on:
  push:
    branches: ["main", "claude/lucid-bell-7thkev"]
    paths: ["release.json"]
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace an existing release with the same version"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: display-tuner-release
  # Never cancel a run between deleting and recreating a release.
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Validate version
        run: |
          python3 scripts/validate-release.py
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('release.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('VERSION=' + metadata['version'] + '\n')
              env.write('TAG=' + metadata['tag'] + '\n')
          PYTHON
      - name: Core tests
        run: swift test --package-path DisplayTuner
      - name: Package app
        run: bash DisplayTuner/make-app.sh --package
      - name: Verify signature and archive
        run: |
          codesign --verify --deep --strict "DisplayTuner/.build/app/Gamut Pro.app"
          unzip -t "DisplayTuner/dist/GamutPro-$VERSION-macOS.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "Release $TAG already exists; run the workflow with replace to republish it." >&2
              exit 1
            fi
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # A leftover tag would make the release ignore --target.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" \
            "DisplayTuner/dist/GamutPro-$VERSION-macOS.zip" \
            DisplayTuner/dist/SHA256SUMS.txt \
            DisplayTuner/dist/GamutPro-Icon.png \
            LICENSE \
            --target "$GITHUB_SHA" \
            --title "Gamut Pro $VERSION" \
            --notes-file RELEASE_NOTES.md
