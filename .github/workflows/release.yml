name: Publish Display Tuner
on:
  push:
    branches: ["claude/lucid-bell-7thkev"]
    paths: ["release.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: display-tuner-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Validate version
        run: |
          python3 scripts/validate-release.py
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('release.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('VERSION=' + metadata['version'] + '\n')
              env.write('TAG=' + metadata['tag'] + '\n')
          PYTHON
      - name: Core tests
        run: swift test --package-path DisplayTuner
      - name: Package app
        run: bash DisplayTuner/make-app.sh --package
      - name: Verify signature and archive
        run: |
          codesign --verify --deep --strict "DisplayTuner/.build/app/Display Tuner.app"
          unzip -t "DisplayTuner/dist/DisplayTuner-$VERSION-macOS.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "DisplayTuner/dist/DisplayTuner-$VERSION-macOS.zip" \
            DisplayTuner/dist/SHA256SUMS.txt \
            DisplayTuner/dist/DisplayTuner-Icon.png \
            --target "$GITHUB_SHA" \
            --title "Display Tuner $VERSION — Your display, refined" \
            --notes-file RELEASE_NOTES.md
